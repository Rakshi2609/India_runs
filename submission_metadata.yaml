ai_usage_summary: |
  Used Gemini as an autonomous coding assistant to write the ranking scripts, update reasoning generators, format the final output, and validate the submission according to the provided specification.

methodology_summary: |
  Rule-based ranker using semantic alignment and explicit reasoning capture. Uses sentence-transformers (all-MiniLM-L6-v2) for JD-to-candidate semantic similarity. The final score is a weighted aggregation of Semantic Alignment (30%), Career Relevance (40%), Production Experience (20%), and Availability (10%), modified by a behavioral engagement multiplier and penalized for buzzword stuffing without substance. Honeypots are filtered upfront.

