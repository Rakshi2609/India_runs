ai_usage_summary: |
  Used Gemini as an autonomous coding assistant. Note: While Gemini wrote the ranking scripts and formatting logic, the specific heuristic thresholds, penalty conditions, and honeypot filters were fully reviewed and manually selected based on direct performance validation.

methodology_summary: |
  Rule-based ranker using semantic alignment and explicit reasoning capture. Uses sentence-transformers (all-MiniLM-L6-v2) for JD-to-candidate semantic similarity. The base score is a weighted aggregation: Career Relevance (40%), Semantic Alignment (30%), Production Experience (20%), and Availability (10%). This is then multiplied by a behavioral engagement multiplier, heavily penalized for buzzword stuffing without career depth, and filtered for honeypots upfront.

