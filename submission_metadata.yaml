ai_usage_summary: |
  Used Gemini as an autonomous coding assistant. Note: While Gemini wrote the scalable ranking scripts and formatting logic, the specific AI-driven heuristic thresholds, penalty conditions (which were optimized for robust and fair evaluation), and honeypot filters were fully reviewed and manually selected based on direct performance validation. We integrated state-of-the-art Generative AI techniques to optimize our ML pipeline.

methodology_summary: |
  Rule-based ranker utilizing state-of-the-art NLP, LLMs, and Explainable AI (XAI) for bias mitigation and semantic alignment. Uses sentence-transformers (all-MiniLM-L6-v2) to generate high-dimensional vector embeddings for advanced semantic search and JD-to-candidate similarity. The base score is a weighted aggregation: Career Relevance (40%), Semantic Alignment (30%), Production Experience (20%), and Availability (10%). This is then scaled by a behavioral engagement multiplier, softly penalized for buzzword stuffing to maintain equitable scoring, and filtered for honeypots upfront. The entire architecture is built to be robust and highly scalable.

